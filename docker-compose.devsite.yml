# Development-site overrides — the public dmtc-devel.org stack, run on the same
# droplet as production as a separate compose project with its own MySQL and
# Solr volumes (non-authoritative data; see imls-dmt-api issue #106).
#
# Usage:  make devsite-up      (docker compose -p dmtc-devsite \
#           -f docker-compose.yml -f docker-compose.devsite.yml --env-file .env.devsite up -d)
#
# Publishes no ports. The production Caddy (docker-compose.prod.yml) reaches
# this project's nginx over the shared "dmtc-edge" network under the alias
# "ui-devsite" and serves it on dmtc-devel.org. Start the prod project first
# so the network exists.

services:

  ui:
    build:
      # The Dockerfile's last stage is the hot-reload dev server; without an
      # explicit target Docker would build that instead of the nginx image.
      target: production
    ports: !reset []
    restart: always
    mem_limit: 128m
    memswap_limit: 128m
    networks:
      default:
      edge:
        aliases:
          - ui-devsite

  # The development site is the softer tenant: memory limits as in production
  # (see docker-compose.prod.yml) and, unlike production, CPU caps so a dev
  # reindex or a runaway request cannot starve the production stack.

  api:
    restart: always
    environment:
      FLASK_DEBUG: "0"
    cpus: 1
    mem_limit: 768m
    memswap_limit: 768m

  mysql:
    restart: always
    cpus: 1
    mem_limit: 768m
    memswap_limit: 768m

  solr:
    restart: always
    environment:
      SOLR_HEAP: ${SOLR_HEAP:-768m}
    cpus: 2
    mem_limit: 1280m
    memswap_limit: 1280m

networks:
  edge:
    external: true
    name: dmtc-edge
